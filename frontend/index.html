<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Review Agent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 Resume Review Agent</h1>
            <p>Upload your resume for AI-powered analysis and feedback</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-box" id="uploadBox">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>Drop your resume here</h3>
                    <p>or click to browse</p>
                    <p class="file-types">Supports PDF, DOCX, Images (JPG, PNG)</p>
                    <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.jpg,.jpeg,.png" hidden>
                </div>

                <div class="file-info" id="fileInfo" style="display: none;">
                    <div class="file-details">
                        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                            <polyline points="13 2 13 9 20 9"></polyline>
                        </svg>
                        <div>
                            <p class="file-name" id="fileName"></p>
                            <p class="file-size" id="fileSize"></p>
                        </div>
                    </div>
                    <button class="btn-remove" id="removeFile">Remove</button>
                </div>

                <div class="job-description-section">
                    <label for="jobDescription">Job Description (Optional)</label>
                    <textarea 
                        id="jobDescription" 
                        placeholder="Paste the job description here to get tailored feedback..."
                        rows="4"
                    ></textarea>
                </div>

                <button class="btn-primary" id="analyzeBtn" disabled>
                    Analyze Resume
                </button>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <h2>Analysis Results</h2>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing your resume...</p>
                </div>
                <div class="results-content" id="resultsContent"></div>
            </div>
        </main>

        <footer>
            <p>Powered by OpenAI GPT-4o-mini</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
